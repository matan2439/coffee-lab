<style>
/* Layout: right-hand sidebar (RTL) + content column; drawer nav on phones. Instrument-panel feel: mono numerals, hairline rules, copper as the single accent. */
:root {

}

    --accent: #d38d5c; --accent-fg: #1c140f; --accent-soft: #3a2a1f; --sage: #8db393; --sage-soft: #26302a;
    --good: #86b58f; --warn: #d4aa55; --bad: #de8272; --info: #8ea6c0;
    --c1: #d79563; --c2: #8fba98; --c3: #c8a07a; --c4: #8fa6c0; --c5: #e0b94f; --c6: #bf8fae;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171310; --surface: #211b17; --surface2: #2b231e; --fg: #efe6d9; --muted: #a59787; --line: #3b322a;

* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

button.chip { cursor: pointer; } button.chip:hover { border-color: var(--line); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 500; background: var(--surface2); color: var(--muted); }
.pill.good { background: var(--sage-soft); color: var(--good); } .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); } .pill.info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }

input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=url], input[type=search], select, textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-height: 36px; min-width: 0; }
input[type=number] { font-family: var(--f-num); }

.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }

.overlay { position: fixed; inset: 0; background: rgba(20, 14, 10, .55); z-index: 50; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-left, 0px)); }

.modal.wide { width: min(100%, 960px); }

.empty { text-align: center; padding: 30px 16px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--fg); font-size: 15px; }
.empty-chart { padding: 28px 12px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; font-size: 13px; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--surface2); font-size: 12.5px; color: var(--muted); }
.note.warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--fg); }
.note.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--fg); }

.list { display: grid; gap: 8px; }

.item.click { cursor: pointer; } .item.click:hover { border-color: var(--accent); }

.meter { height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--sage); border-radius: 99px; }
.meter.low > i { background: var(--warn); }
/* charts */
svg.chart { width: 100%; height: auto; max-height: 300px; display: block; }
svg.chart.donut { max-width: 170px; margin: 0 auto; } svg.chart.radar { max-width: 340px; margin: 0 auto; } svg.chart.wheel { max-width: 420px; margin: 0 auto; max-height: none; }
svg.chart text { font-family: var(--f-ui); }
.chart .grid { stroke: var(--line); stroke-width: 1; } .chart .ring { fill: none; stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 10.5px; font-family: var(--f-num) !important; } .chart .axl { fill: var(--muted); font-size: 11px; }
.chart .line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; } .chart .pt:hover { r: 7; }

.chart .wseg { cursor: pointer; stroke: var(--surface); stroke-width: 1; }
.chart .wseg.tag { opacity: .25; } .chart .wseg.tag.sel { opacity: 1; } .chart .wseg.tag:hover { opacity: .6; } .chart .wseg.tag.sel:hover { opacity: .85; }

.bars { display: grid; gap: 7px; }

.bar-l { overflow-wrap: anywhere; } .bar-t { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; } .bar-f { display: block; height: 100%; background: var(--c1); border-radius: 99px; }
.bar-v { font-family: var(--f-num); font-size: 12.5px; text-align: end; white-space: nowrap; } .bar-v small { font-size: 10.5px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; }

/* sensory */
.sens { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sens:last-child { border-bottom: 0; }
.sens-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sens-v { font-family: var(--f-num); font-size: 18px; min-width: 42px; text-align: end; }

.scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
/* brew lab */
.timer { font-family: var(--f-num); font-size: clamp(56px, 16vw, 112px); font-weight: 500; letter-spacing: -.04em; line-height: 1; text-align: center; direction: ltr; }
.timer-card { display: grid; gap: 14px; justify-items: center; padding: 22px; }
.steps { display: grid; gap: 6px; width: 100%; }
.step { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.step .t { font-family: var(--f-num); color: var(--muted); direction: ltr; text-align: end; }
.step.cur { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.stat-row { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }

.acc > summary::-webkit-details-marker { display: none; }

.prose p + p { margin-top: 8px; } .prose ul { margin: 6px 0; padding-inline-start: 20px; } .prose li { margin: 3px 0; }
.big-in { font-family: var(--f-num); font-size: 22px; }

@media (max-width: 920px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(280px, 86vw); z-index: 40; transform: translateX(100%); transition: transform .2s; padding-top: max(18px, env(safe-area-inset-top, 0px)); box-shadow: var(--shadow); }

}

.page { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }

.btn { border-radius: 10px; transition: background .12s, border-color .12s, filter .12s; }

/* ===== Theme "Crema & Charcoal" — modern, restrained, flow-first ===== */
:root {
  --bg: #f6f2ec; --surface: #fffdf9; --surface2: #efe9e0; --fg: #1f1a16; --muted: #7a6f64; --line: #e6ded2;
  --accent: #9c5b2e; --accent-fg: #fffaf3; --accent-soft: #f1e3d4; --sage: #5f7348; --sage-soft: #e6ebdc;
  --good: #4f6e45; --warn: #9a6f1c; --bad: #a8473a; --info: #4d6478;
  --c1: #9c5b2e; --c2: #5f7348; --c3: #4d6478; --c4: #9a4f62; --c5: #9a7424; --c6: #6b5a8a;
  --h-dashboard: #9c5b2e; --h-brew: #a8552f; --h-beans: #5f7348; --h-recipes: #9a7424; --h-journal: #4d6478; --h-sensory: #9a4f62;
  --h-equipment: #626a70; --h-experiments: #6b5a8a; --h-analytics: #3f7470; --h-academy: #545f92; --h-settings: #6f675f;
  --k-int: #4d6478; --k-qual: #5f7348; --k-enj: #9a4f62;
  --ink: #1f1a16; --ink-fg: #fbf7f1;
  --shadow: 0 1px 2px rgba(31, 26, 22, .04), 0 8px 24px rgba(31, 26, 22, .05);
  --f-ui: 'Assistant', 'Heebo', 'Segoe UI', Arial, sans-serif;
  --f-display: 'Frank Ruhl Libre', 'David', Georgia, serif;
  --f-num: 'Assistant', 'Segoe UI', Arial, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141110; --surface: #1c1815; --surface2: #26201c; --fg: #f2ebe2; --muted: #a39686; --line: #332b25;
    --accent: #d9a06b; --accent-fg: #1a120c; --accent-soft: #3a2a1e; --sage: #9fb586; --sage-soft: #263022;
    --good: #9fb586; --warn: #d9b062; --bad: #e08b7c; --info: #93acc2;
    --c1: #d9a06b; --c2: #9fb586; --c3: #93acc2; --c4: #d695a6; --c5: #d8b866; --c6: #b3a2d6;
    --h-dashboard: #d9a06b; --h-brew: #e39570; --h-beans: #9fb586; --h-recipes: #d8b866; --h-journal: #93acc2; --h-sensory: #d695a6;
    --h-equipment: #a9b1b7; --h-experiments: #b3a2d6; --h-analytics: #86c1ba; --h-academy: #a2abe0; --h-settings: #b6ada2;
    --k-int: #93acc2; --k-qual: #9fb586; --k-enj: #d695a6; --ink: #f2ebe2; --ink-fg: #141110;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141110; --surface: #1c1815; --surface2: #26201c; --fg: #f2ebe2; --muted: #a39686; --line: #332b25;
  --accent: #d9a06b; --accent-fg: #1a120c; --accent-soft: #3a2a1e; --sage: #9fb586; --sage-soft: #263022;
  --good: #9fb586; --warn: #d9b062; --bad: #e08b7c; --info: #93acc2;
  --c1: #d9a06b; --c2: #9fb586; --c3: #93acc2; --c4: #d695a6; --c5: #d8b866; --c6: #b3a2d6;
  --h-dashboard: #d9a06b; --h-brew: #e39570; --h-beans: #9fb586; --h-recipes: #d8b866; --h-journal: #93acc2; --h-sensory: #d695a6;
  --h-equipment: #a9b1b7; --h-experiments: #b3a2d6; --h-analytics: #86c1ba; --h-academy: #a2abe0; --h-settings: #b6ada2;
  --k-int: #93acc2; --k-qual: #9fb586; --k-enj: #d695a6; --ink: #f2ebe2; --ink-fg: #141110;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); color-scheme: dark;
}

/* typography */
body { font-size: 15px; letter-spacing: 0; -webkit-font-smoothing: antialiased; }
h1, .home-h h1 { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: -.01em; line-height: 1.15; }
.card-h h2 { font-size: 15.5px; font-weight: 700; }
.rc-name, .rail-c b { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.num, .mono { font-variant-numeric: tabular-nums lining-nums; }
.kpi .v, .stat-strip b, .sum-c b { font-family: var(--f-display); font-weight: 500; letter-spacing: 0; }
.timer { font-family: var(--f-ui); font-weight: 200; letter-spacing: -.02em; font-size: clamp(72px, 20vw, 140px); }
.grp-h { font-size: 12px; letter-spacing: .04em; font-weight: 700; }

/* calm surfaces: no tinted washes, one quiet rule per panel */
.main { background: var(--bg); }
.card { border-radius: var(--r); border-color: var(--line); box-shadow: var(--shadow); padding: 18px; }
.card[style*="--tone"], .rail-c, .chosen, .rc-card, .lib-card { background: var(--surface); }
.card-h h2::before { width: 6px; height: 6px; border-radius: 50%; }
.card.kpi { border-top: 1px solid var(--line); }
.card.kpi .kpi-ico { background: transparent; }
.rc-card, .lib-card, .rail-c, .chosen { border-top: 1px solid var(--line); position: relative; overflow: hidden; }
.rc-card::before, .lib-card::before, .rail-c::before, .chosen::before { content: ''; position: absolute; inset-inline-start: 0; inset-block: 0; width: 3px; background: var(--m); }
.page { gap: 22px; }
.page-h p { font-size: 14px; }
.ph-ico { background: transparent; border-color: var(--line); color: var(--fg); }

/* navigation: monochrome, accent only on the active item */
.side { background: var(--surface); }
.nav-i { background: transparent; color: var(--muted); }
.nav-b svg { color: var(--muted) !important; }
.nav-b[aria-current="page"] { background: var(--surface2); box-shadow: none; }
.nav-b[aria-current="page"] .nav-i { background: var(--ink); }
.nav-b[aria-current="page"] .nav-i svg { color: var(--ink-fg) !important; }
.nav-b .en { display: none; }
.brand-mark { background: var(--ink); color: var(--ink-fg); border-radius: 50%; }
.brand b { font-family: var(--f-display); font-size: 16px; }

/* buttons: charcoal for primary actions, caramel only for brewing */
.btn { border-radius: 12px; min-height: 40px; font-weight: 600; }
.btn.sm { border-radius: 10px; min-height: 32px; }
.btn.pri { background: var(--ink); border-color: var(--ink); color: var(--ink-fg); }
.side-cta, .go-btn, .m-bar .btn, .btn.brew { background: var(--accent) !important; border-color: var(--accent) !important; color: var(--accent-fg) !important; }
.bnav .bn-main .bn-i, .bnav .bn-main[aria-current="page"] .bn-i { background: var(--accent); color: var(--accent-fg); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent); }
.tabs { background: transparent; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0; gap: 18px; width: 100%; }
.tab { border-radius: 0; padding: 10px 2px; background: none !important; box-shadow: none !important; border-bottom: 2px solid transparent; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); font-weight: 700; }
.chip { border-radius: 99px; padding: 4px 12px; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--ink-fg); }
.chip.on .mpill { color: var(--ink-fg); }
.mbtn { border-radius: 14px; border-width: 1px; background: var(--surface); }
.mbtn.on { background: var(--surface); border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.qtile { border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.qtile .nav-i { color: var(--fg); background: var(--surface2); border-radius: 10px; }
.qtile.hot { border-color: var(--accent); background: var(--surface); } .qtile.hot small { color: var(--accent); }
.stat-strip { box-shadow: var(--shadow); }
.tip-c { background: var(--surface); border-color: var(--line); color: var(--muted); }
.mpill { background: transparent; border: 1px solid var(--line); }
.pill { border-radius: 99px; }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], input[type=url], input[type=search], select, textarea { border-radius: 12px; background: var(--surface); min-height: 44px; }
input:focus, select:focus, textarea:focus { border-color: var(--fg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fg) 10%, transparent); }
:focus-visible { outline-color: var(--fg); }
.item { border-radius: 12px; background: var(--surface); }
.item.click:hover { border-color: var(--fg); background: var(--surface); }
.step { border-radius: 12px; background: var(--surface); }
.step.cur { border-color: var(--accent); background: var(--accent-soft); }
.timer-card { border-top: 1px solid var(--line); }
.prog { height: 4px; } .prog > i { background: var(--accent); }
.num-b { background: var(--ink); color: var(--ink-fg); }
.go-card .sum-c { background: var(--bg); }
.modal { border-radius: 20px; } .modal-h h2 { font-family: var(--f-display); font-size: 20px; }
.overlay { backdrop-filter: blur(3px); }
.bnav { background: color-mix(in srgb, var(--surface) 92%, transparent); }
.bnav button[aria-current="page"] .bn-i { background: var(--surface2); color: var(--fg); }

/* ===== brew flow: one continuous path ===== */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; counter-reset: fl; }
.flow > span { display: grid; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; }
.flow > span::before { content: ''; height: 3px; border-radius: 99px; background: var(--line); }
.flow > span.done { color: var(--fg); } .flow > span.done::before { background: var(--fg); }
.flow > span.cur { color: var(--accent); } .flow > span.cur::before { background: var(--accent); }
.flow-wrap { display: grid; gap: 10px; }
.flow-next { font-size: 12.5px; color: var(--muted); text-align: center; }
@media (min-width: 921px) {
  .m-bar.always { display: flex; position: sticky; bottom: 0; z-index: 10; justify-content: center; gap: 10px; padding: 14px 0 6px; background: linear-gradient(0deg, var(--bg) 70%, transparent); }
  .m-bar.always .btn { width: auto; min-width: 280px; }
}
@media (max-width: 920px) { .m-bar { display: flex; gap: 8px; } .m-bar .btn { flex: 1; } .m-bar .btn.sec { flex: 0 0 auto; background: var(--surface) !important; color: var(--fg) !important; border-color: var(--line) !important; } }
@media (max-width: 700px) { h1, .home-h h1 { font-size: 25px; } .card { padding: 15px; } }
@media (max-width: 920px) { .m-bar .btn { width: auto; min-width: 0; flex: 1 1 0; } .m-bar .btn.sec { flex: 0 0 auto; padding-inline: 14px; } }
.home-h { align-items: center; }
/* ===== V2 layout: brew-first, quiet, few words ===== */
.page.narrow { max-width: 760px; gap: 16px; }
.v-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.v-head h1 { font-size: 28px; }
.v-head .row .btn svg, .btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn svg path[d^="M8 5v14"] { fill: currentColor; stroke: none; }
.muted { color: var(--muted); } .s { font-size: 13px; }
.blk { display: grid; gap: 8px; }
.blk-h { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.sec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }

/* horizontal chip rails */
.chips-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.chips-row::-webkit-scrollbar { display: none; }
.chips-row.wrap { flex-wrap: wrap; overflow: visible; }
.pchip, .bchip, .tchip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; cursor: pointer; color: var(--fg); font: inherit; }
.pchip { --m: var(--accent); display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; font-weight: 600; min-height: 46px; }
.pchip i { width: 9px; height: 9px; border-radius: 50%; background: var(--m); }
.pchip.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.pchip.add, .bchip.add { color: var(--muted); font-size: 20px; padding: 8px 16px; display: grid; place-items: center; }
.bchip { display: grid; gap: 1px; padding: 9px 14px; text-align: start; min-height: 52px; max-width: 220px; }
.bchip b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bchip small { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.bchip.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.bchip.add svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.tchip { padding: 8px 14px; font-size: 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; }
.tchip.on { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.tchip.ok.on { background: var(--good); border-color: var(--good); color: #fff; }
.tchip.chk input { width: 16px; height: 16px; accent-color: var(--fg); }

/* today card */
.today { --m: var(--accent); display: grid; gap: 14px; border-top: 3px solid var(--m); }
.today-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.today-h b { font-family: var(--f-display); font-size: 20px; } .src { color: var(--muted); font-size: 12.5px; }
.stp-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stp { display: grid; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.stp-l { font-size: 12.5px; color: var(--muted); font-weight: 600; text-align: center; }
.stp-c { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 4px; }
.stp-b { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; cursor: pointer; color: var(--fg); line-height: 1; }
.stp-b:active { transform: scale(.96); }
input.stp-v, .stp-v { text-align: center; font-family: var(--f-display); font-size: 24px; border: 0 !important; background: transparent !important; box-shadow: none !important; min-height: 44px; padding: 0; width: 100%; }
.stp-u { text-align: center; font-size: 11.5px; color: var(--muted); min-height: 14px; }
.today-sum { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.today-sum .ratio { font-family: var(--f-display); font-size: 22px; } .today-sum .fixed { color: var(--muted); font-size: 13px; }
.gear-row { display: flex; gap: 6px; flex-wrap: wrap; } .gtag { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--surface2); color: var(--muted); }
.best { border: 1px dashed var(--line); background: transparent; border-radius: 12px; padding: 9px 12px; text-align: start; cursor: pointer; color: var(--fg); font: inherit; font-size: 13.5px; }
.best:hover { border-color: var(--fg); }
.warn-l { color: var(--warn); font-size: 13px; }
.go-row { display: flex; gap: 10px; align-items: center; }
.btn.go { flex: 1; min-height: 56px; font-size: 18px; border-radius: 16px; background: var(--accent); border-color: var(--accent); color: var(--accent-fg); gap: 10px; }
.btn.go:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; border-color: var(--line); min-height: 56px; border-radius: 16px; }
.btn.ghost.sm { min-height: 36px; border-radius: 10px; }
.btn.big { min-height: 56px; font-size: 17px; border-radius: 16px; flex: 1; }
.tip-l { color: var(--muted); font-size: 13px; text-align: center; }

/* live */
.app.focus .side { opacity: .35; }
.live { --m: var(--accent); justify-items: center; text-align: center; gap: 18px; padding-top: 28px; }
.live-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; } .live-top b { font-family: var(--f-display); font-size: 18px; } .live-top small { color: var(--muted); }
.live .timer { font-size: clamp(88px, 26vw, 168px); }
.timer.in { color: var(--good); } .timer.over { color: var(--bad); }
.live .prog { width: min(100%, 520px); }
.win { position: relative; width: min(100%, 520px); height: 10px; border-radius: 99px; background: var(--surface2); }
.win .band { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 35%, transparent); border-radius: 99px; }
.win i { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: var(--fg); transform: translateX(50%); }
.win-l { font-size: 13px; color: var(--muted); }
.stg { font-family: var(--f-display); font-size: 22px; font-weight: 700; max-width: 560px; text-wrap: balance; min-height: 30px; }
.nxt { color: var(--muted); font-size: 14px; min-height: 20px; }
.live-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 520px); }
.live-ctl > .btn.go:only-child, .live-ctl > .btn.go:first-child:nth-last-child(2) { grid-column: 1 / -1; }
.ctl-s { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.steps-d { width: min(100%, 520px); text-align: start; } .steps-d summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 6px 0; }
.snd { color: var(--muted); font-size: 13px; }

/* finish / rate */
.fin h1, .done h1 { font-size: 28px; }
.meas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.meas input { font-family: var(--f-display); font-size: 22px; text-align: center; }
.rate { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.rate-b { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 18px; cursor: pointer; color: var(--fg); }
.rate-b.on { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.note-d summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 12px; } .note-d textarea { margin-top: 8px; }
.check.inv { padding: 0 4px; font-size: 14px; }
.done-h { display: flex; gap: 14px; align-items: center; } .done-i { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--good); color: #fff; font-size: 26px; flex: none; }
.next { --m: var(--accent); border-top: 3px solid var(--m); display: grid; gap: 6px; }
.chg { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; } .chg b { font-family: var(--f-display); font-size: 22px; } .chg span { font-family: var(--f-display); font-size: 26px; }
.why { font-size: 14px; }

/* beans */
.blist { display: grid; gap: 10px; }
.bcard { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: start; cursor: pointer; color: var(--fg); font: inherit; box-shadow: var(--shadow); }
.bcard img, .bph { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--surface2); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; color: var(--muted); }
.bmain { display: grid; gap: 3px; min-width: 0; } .bmain b { font-family: var(--f-display); font-size: 17px; overflow-wrap: anywhere; } .bmain small { color: var(--muted); font-size: 12.5px; }
.bmain .meter { margin-top: 4px; }
.bside { display: grid; gap: 3px; justify-items: end; text-align: end; } .bside small { color: var(--muted); font-size: 12px; }
.score { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 99px; font-weight: 700; font-size: 13px; background: var(--surface2); color: var(--muted); font-variant-numeric: tabular-nums; }
.score.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); } .score.info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); } .score.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.fromscan { font-size: 11px; } .unsure { font-size: 10.5px; color: var(--warn); border: 1px solid currentColor; border-radius: 6px; padding: 0 4px; }
.scan-w { display: grid; justify-items: center; gap: 12px; text-align: center; } .scan-w img { max-height: 220px; border-radius: 12px; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.qbag { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; background: var(--bg); margin-top: 12px; }

/* log */
.seg { display: inline-flex; gap: 4px; background: var(--surface2); padding: 4px; border-radius: 12px; }

    await new Promise((r) => setTimeout(r, 250));
  }
}

});
const TEXTY = new Set(['text', 'search', 'number', 'range', 'email', 'tel', 'url', 'password']);
function handleOn(e, isInput) {

/* ---------- tooltips ---------- */
(function () {
  const tip = $('#tip'); let cur = null;
  const show = (el) => { const t = el.getAttribute('data-tip'); if (!t) return; cur = el; tip.textContent = t; tip.hidden = false; const r = el.getBoundingClientRect(); const w = tip.offsetWidth, h = tip.offsetHeight; let x = r.left + r.width / 2 - w / 2, y = r.top - h - 8; if (y < 4) y = r.bottom + 8; x = Math.max(8, Math.min(window.innerWidth - w - 8, x)); tip.style.left = x + 'px'; tip.style.top = y + 'px'; };
  const hide = () => { cur = null; tip.hidden = true; };
  document.addEventListener('mouseover', (e) => { const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el) show(el); else if (cur) hide(); });
  document.addEventListener('focusin', (e) => { const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el) show(el); });
  document.addEventListener('focusout', hide);
  document.addEventListener('focusin', (e) => { if (e.target && e.target.matches && e.target.matches('textarea[readonly]')) { try { e.target.select(); } catch (x) { /* ignore */ } } });
  document.addEventListener('click', (e) => { const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el && el.matches('circle,.pt,.pill')) show(el); else hide(); }, true);
  window.addEventListener('scroll', hide, true);
})();

/* ---------- cloud mirror (best effort, last writer wins) ---------- */
const CLOUD = { uid: null, base: null, pushing: false, again: false, timer: null, lastPushed: null, shardCache: {}, shards: [] };
const BYTES = (s) => { try { return new TextEncoder().encode(s).length; } catch (e) { return s.length * 3; } };
function setCloud(status, msg) { persist.cloud = status; persist.cloudMsg = msg || ''; try { renderSide(); } catch (e) { /* ignore */ } }
function shardState() {
  const out = {}; const LIMIT = 150000;
  TABLES.forEach((t) => {
    let chunk = [], size = 2, i = 0;
    const flush = () => { if (chunk.length) { out[t + '-' + i] = { table: t, json: JSON.stringify(chunk) }; i++; chunk = []; size = 2; } };
    state[t].forEach((r) => { const s = JSON.stringify(r); const b = BYTES(s); if (b > 230000) throw new Error('רשומה גדולה מדי לסנכרון ב-' + t); if (size + b + 1 > LIMIT) flush(); chunk.push(r); size += b + 1; });
    flush();
  });
  return out;
}
async function cloudPush() {
  if (!CAPS.db || !CLOUD.base) return; if (CLOUD.pushing) { CLOUD.again = true; return; }
  CLOUD.pushing = true; setCloud('busy', 'מסנכרן…');
  try {
    const t0 = state.meta.updatedAt; const shards = shardState(); const ids = Object.keys(shards);
    for (const id of ids) { if (CLOUD.shardCache[id] !== shards[id].json) { await CAPS.db.doc(CLOUD.base + '/t/' + id).set(shards[id]); CLOUD.shardCache[id] = shards[id].json; } }
    for (const old of CLOUD.shards) { if (!ids.includes(old)) { await CAPS.db.doc(CLOUD.base + '/t/' + old).delete(); delete CLOUD.shardCache[old]; } }
    await CAPS.db.doc(CLOUD.base).set({ v: 1, schema: SCHEMA_VERSION, updatedAt: t0, shards: ids, savedAt: nowISO() });
    CLOUD.shards = ids; CLOUD.lastPushed = t0; setCloud('ok', 'הסנכרון האחרון: ' + fmtDateTime(nowISO()));
  } catch (e) { console.error(e); setCloud('fail', 'הסנכרון נכשל' + (e && e.code ? ' (' + e.code + ')' : '') + '. הנתונים נשמרים בדפדפן. נסו ייצוא JSON.'); }
  CLOUD.pushing = false; if (CLOUD.again) { CLOUD.again = false; schedulePush(); }
}
function schedulePush() { if (!CAPS.db || !CLOUD.base) return; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(() => { if (state.meta.updatedAt !== CLOUD.lastPushed) cloudPush(); }, 3000); }
async function cloudPull(cm) {
  const docs = await Promise.all((cm.shards || []).map((id) => CAPS.db.doc(CLOUD.base + '/t/' + id).get()));
  const obj = { app: APP_ID, schema: cm.schema, meta: { createdAt: nowISO(), updatedAt: cm.updatedAt } }; TABLES.forEach((t) => (obj[t] = []));
  for (let i = 0; i < docs.length; i++) { if (!docs[i].exists) throw new Error('שבר חסר בענן: ' + cm.shards[i]); const d = docs[i].data(); if (!TABLES.includes(d.table)) throw new Error('טבלה לא מוכרת בענן'); JSON.parse(d.json).forEach((r) => obj[d.table].push(r)); CLOUD.shardCache[cm.shards[i]] = d.json; }
  const data = migrate(obj); const v = validateState(data); if (v.errors.length) throw new Error('נתוני הענן אינם תקינים (' + v.errors.length + ' שגיאות). לא נטענו.');
  return data;
}
async function cloudReconcile(force) {
  if (!CAPS.db || !CLOUD.base) return; setCloud('busy', 'בודק סנכרון…');
  try {
    const snap = await CAPS.db.doc(CLOUD.base).get();
    if (!snap.exists) { await cloudPush(); return; }
    const cm = snap.data(); CLOUD.shards = cm.shards || [];
    const cloudNewer = String(cm.updatedAt || '') > String(state.meta.updatedAt || '');
    if (cm.updatedAt === state.meta.updatedAt) { CLOUD.lastPushed = cm.updatedAt; setCloud('ok', 'הנתונים זהים לענן'); return; }
    if (BOOT.fresh || (cloudNewer && !UI.dirty)) {
      const data = await cloudPull(cm); makeBackup('before-cloud'); state = data; flushSave(); state.meta.updatedAt = cm.updatedAt; try { if (persist.mode === 'local') localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
      CLOUD.lastPushed = cm.updatedAt; UI.dirty = false; applyTheme(); render(); setCloud('ok', 'נטענו נתונים חדשים יותר מהחשבון'); toast('נטענו נתונים עדכניים מהחשבון'); return;
    }
    if (cloudNewer) { setCloud('warn', 'בענן יש גרסה חדשה יותר. פעולות שביצעתם בדף הזה נשמרו מקומית ויכתבו על הענן בסנכרון הבא.'); }
    await cloudPush();
  } catch (e) { console.error(e); setCloud('fail', 'הסנכרון נכשל: ' + (e && e.message ? e.message : 'שגיאה')); }
}
ACT['cloud-sync'] = async () => { if (!CAPS.db) return toast('סנכרון לחשבון אינו זמין בתצוגה הזו'); await cloudReconcile(true); if (UI.view === 'settings' && !UI.modal) render(); };
async function initCaps() {
  if (typeof claude === 'undefined' || !claude.use) { CAPS.why = 'לא בתוך Claude'; setCloud('off', 'סנכרון לחשבון אינו זמין בתצוגה הזו'); return; }
  const get = async (n) => { try { return await claude.use(n); } catch (e) { return null; } };
  CAPS.downloads = await get('downloads'); CAPS.sample = await get('sample'); if (CAPS.sample) { try { const lim = await CAPS.sample.limits(); CAPS.images = !!(lim && lim.images); } catch (e) { CAPS.images = false; } } CAPS.why = !CAPS.sample ? 'Claude לא זמין בתצוגה הזו' : !CAPS.images ? 'שליחת תמונות ל-Claude לא נתמכת בתצוגה הזו' : ''; if (CAPS._res) CAPS._res(); CAPS.user = await get('user'); CAPS.db = await get('db');
  if (!CAPS.db || !CAPS.user) { setCloud('off', 'סנכרון לחשבון אינו זמין בתצוגה הזו (לא מחוברים, או שהיכולת כבויה)'); return; }
